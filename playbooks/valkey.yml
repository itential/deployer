---
### Valkey
- name: Configure Valkey data nodes
  hosts: valkey_master, valkey_replica
  become: true
  roles:
    # Pull in the common vars
    - role: itential.deployer.common

    # Perform a base installation of Valkey and optionally configure authorization and replication
    - role: itential.deployer.valkey

- name: Configure Valkey sentinel nodes
  hosts: valkey_sentinel
  become: true
  roles:
    # Pull in the common vars
    - role: itential.deployer.common

    # Perform a base installation of Valkey and optionally configure authorization and replication
    - role: itential.deployer.valkey
