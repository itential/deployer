---
# The location of the Valkey binary
valkey_bin_dir: "{{ valkey_bin_dir_default }}"

# The location of the Valkey config file
valkey_conf_dir: "{{ valkey_conf_dir_default }}"
valkey_conf_file: "{{ valkey_conf_dir }}/valkey.conf"

# The location of the Valkey log file
valkey_log_dir: "{{ valkey_log_dir_default }}"
valkey_log: "{{ valkey_log_dir }}/valkey.log"

# The name of the Valkey data file
valkey_db_filename: dump.rdb

# The location of the Valkey data directory
valkey_data_dir: "{{ valkey_data_dir_default }}"

# Valkey user and group
valkey_owner: valkey
valkey_group: valkey

# Default valkey port
valkey_port: "{{ valkey_port_default }}"

# Bind to localhost + private network interface.
# ansible_default_ipv4.address is not guaranteed to be present (e.g. hosts
# with no default route), so fall back to an empty string when undefined.
valkey_bind: "127.0.0.1 {{ ansible_default_ipv4.address | default('') }}"

# Feature flags that can be overridden in the hosts file
# Essentially, a default installation will have auth, but not tls
valkey_auth_enabled: true
valkey_tls_enabled: true

# Replication settings
valkey_replicaof: "{{ groups['valkey_master'][0] }} {{ valkey_port }}"

# Valkey replica priority for Sentinel failover
# Lower values = higher priority (more likely to be promoted)
# Set to 'auto' to calculate based on position, or specify explicit value (0-100)
# 0 = never promote this replica
valkey_replica_priority: auto

# Default valkey user passwords
# These are meant to be changed by the customer. By default they are meant to
# be predictable and simple.
valkey_user_admin_password: admin
valkey_user_itential_password: itential
valkey_user_repluser_password: repluser
valkey_user_sentineladmin_password: admin
valkey_user_sentineluser_password: sentineluser
valkey_user_monitor_password: monitor

# By default the monitor user will not be created. If set to true, the monitor user will be
# created with the appropriate ACL to allow monitoring systems to gather metric data.
valkey_monitor_user_enabled: false

# Valkey TLS configuration options
valkey_tls_port: "{{ valkey_tls_port_default }}"
valkey_tls_auth_clients: "no"
valkey_tls_protocols: "TLSv1.3"

# Valkey memory sizing defaults (dedicated Valkey node)

# If set to "auto", maxmemory is calculated from system RAM.
# If set to a number (bytes), that value is used verbatim.
valkey_maxmemory_bytes: auto

# Used only when valkey_maxmemory_bytes == "auto"
valkey_maxmemory_ratio: 0.80
valkey_maxmemory_min_mb: 512

# Default location for the certification report files
valkey_certify_report_dir_remote: /var/tmp/itential-reports/valkey
valkey_certify_report_dir_local: /tmp/itential-reports/valkey
