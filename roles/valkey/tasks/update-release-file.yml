---
- name: Determine valkey version
  ansible.builtin.shell:
    cmd: 'set -o pipefail && valkey-server --version | cut -d" " -f3 | cut -d"=" -f2'
  register: result
  check_mode: false
  changed_when: false
  failed_when: result.rc != 0
  environment:
    PATH: "{{ ansible_env.PATH }}:{{ valkey_bin_dir }}"

- name: Write valkey release information
  ansible.builtin.lineinfile:
    path: "{{ common_itential_release_file }}"
    regexp: "^VALKEY="
    line: "VALKEY={{ result.stdout }}"
    create: true
    mode: "0644"
