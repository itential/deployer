---

- name: Load Itential Platform release default variables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - "platform-release-{{ platform_release }}.yml"
    - "platform-release-{{ platform_release | string | split('.') | first }}.yml"
    - "platform-release-undefined.yml"

- name: Verify Valkey host requirements
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-host
  vars:
    component_name: "Valkey"
    hw_specs_var_name: "valkey_hw_specs"

# valkey specific verification tasks go here...

- name: Verify connectivity to required public repositories
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-connectivity
  vars:
    required_repositories: "{{ valkey_required_repositories }}"

- name: Report Valkey results
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-results
  vars:
    component_name: "Valkey"
