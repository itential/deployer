---
# The keys represent the EL major version (ansible_distribution_major_version).
# Valkey is only supported on EL9 (via the native AppStream module) and Amazon Linux 2023 (via
# its own core repository) -- there is no "8" entry (see validate-vars.yml, which asserts one of
# these two before this is ever looked up).
valkey_packages_default:
  "9":
    - "valkey"
  "2023":
    - "valkey"

valkey_hw_specs:
  "dev":
    "cpu_count": 8
    "ram_size": 16
    "disk_size": 100
  "test":
    "cpu_count": 8
    "ram_size": 32
    "disk_size": 100
  "prod":
    "cpu_count": 8
    "ram_size": 32
    "disk_size": 100
